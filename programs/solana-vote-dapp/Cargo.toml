[package]
name = "solana-vote-dapp"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_vote_dapp"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.1"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
