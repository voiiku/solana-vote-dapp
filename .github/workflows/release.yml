name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          rustflags: ""

      - name: Validate release tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v") or not tag[1:]:
              raise SystemExit(f"Release tag must use v<version> format: {tag!r}")
          tag_version = tag[1:]

          cargo_metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          rust_versions = {
              package["version"]
              for package in cargo_metadata["packages"]
              if package["name"] == "solana-vote-dapp"
          }
          if len(rust_versions) != 1:
              raise SystemExit(
                  f"Expected one solana-vote-dapp Cargo package, found {rust_versions}"
              )
          cargo_version = rust_versions.pop()
          app_version = json.loads(Path("app/package.json").read_text())["version"]

          for source, version in (("Cargo", cargo_version), ("app/package.json", app_version)):
              if version != tag_version:
                  raise SystemExit(
                      f"Tag version {tag_version!r} does not match {source} version {version!r}"
                  )
          print(f"Release tag {tag} matches Cargo and frontend version {tag_version}.")
          PY

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Generate Rust third-party notices
        run: |
          cargo fetch --locked
          cargo about generate --workspace about.hbs --locked -o ./programs/PROGRAM-THIRD-PARTY-NOTICES.html

      - name: Generate frontend third-party notices
        working-directory: app
        run: npm run licenses

      - name: Normalize generated notice line endings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              "app/APP-THIRD-PARTY-NOTICES.html",
              "programs/PROGRAM-THIRD-PARTY-NOTICES.html",
          ):
              path = Path(name)
              contents = path.read_text(encoding="utf-8")
              path.write_text(contents.replace("\r\n", "\n").replace("\r", "\n"), encoding="utf-8")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            LICENSE \
            app/APP-THIRD-PARTY-NOTICES.html \
            programs/PROGRAM-THIRD-PARTY-NOTICES.html \
            --verify-tag \
            --generate-notes
